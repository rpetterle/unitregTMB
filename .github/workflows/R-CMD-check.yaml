# Continuous integration for unitregTMB.
# regcore is hosted on GitHub, not CRAN: install it explicitly.
name: R-CMD-check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions: read-all

jobs:
  R-CMD-check:
    name: ${{ matrix.os }} (R release)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install dependencies (including regcore from GitHub)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            rpetterle/regcore
            any::rcmdcheck
            any::testthat
          needs: check

      - name: Verify regcore availability
        shell: Rscript {0}
        run: |
          stopifnot(requireNamespace("regcore", quietly = TRUE))
          cat("regcore version:", as.character(packageVersion("regcore")), "\n")

      - name: Check R package
        uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          build_args: '"--no-manual"'
          error-on: '"warning"'
          upload-results: 'true'
